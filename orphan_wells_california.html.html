// ==================== CONFIG ====================
const PHASE_META = [
  {key:'Phase 1',              label:'Phase 1',       short:'Phase 1',       color:'#d32f2f'},
  {key:'Phase 2',              label:'Phase 2',       short:'Phase 2',       color:'#1565c0'},
  {key:'P&S Order (No Phase)', label:'P&S Order',     short:'P&S Order',     color:'#999999'},
  {key:'State Plugged',        label:'State Plugged', short:'State Plugged', color:'#2e7d32'},
];
const REPORT_DATE_ISO = '2026-04-06'; // From source filename CA_Orphan_Wells (20260406).xlsx

// ==================== DISPLAY HELPERS ====================
const KEEP_UPPER = new Set([
  'LLC','LP','LLP','LTD','INC','CO','CORP','USA',
  'N','S','E','W','NE','NW','SE','SW'
]);
function titleCase(s){
  if(!s) return s;
  return s.split(/(\s+)/).map(tok => {
    if(/^\s+$/.test(tok)) return tok;
    return titleCaseToken(tok);
  }).join('');
}
function titleCaseToken(tok){
  const letters = tok.replace(/[^A-Za-z]/g, '');
  if(letters && KEEP_UPPER.has(letters.toUpperCase()) && tok === tok.toUpperCase()){
    return tok;
  }
  return tok.replace(/([A-Za-z]+)/g, (word, _g, offset) => {
    const upper = word.toUpperCase();
    // Possessive 's after an apostrophe — must run BEFORE the keep-upper check
    if(word.length === 1 && offset > 0 && tok.charAt(offset - 1) === "'"){
      return word.toLowerCase();
    }
    if(KEEP_UPPER.has(upper)) return upper;
    if(/^MC[A-Z]/i.test(word) && word.length > 2){
      return 'Mc' + word.charAt(2).toUpperCase() + word.slice(3).toLowerCase();
    }
    if(/^MAC[A-Z]/i.test(word) && word.length > 3){
      return 'Mac' + word.charAt(3).toUpperCase() + word.slice(4).toLowerCase();
    }
    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
  });
}

let activePhases = new Set(PHASE_META.map(p => p.key));

// ==================== MAP ====================
const map = L.map('map', {center:[37, -120], zoom:6, zoomControl:true, preferCanvas:true});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: "",
  maxZoom: 19,
  subdomains: 'abcd',
  opacity: 1
}).addTo(map);

// State boundaries via TopoJSON — match standard exactly
const topoScript = document.createElement('script');
topoScript.src = 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';
topoScript.onload = () => {
  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(r => r.json())
    .then(us => {
      const geojson = topojson.feature(us, us.objects.states);
      L.geoJSON(geojson, {
        style: {
          color: '#7a94b0',
          weight: 1.2,
          fill: true,
          fillColor: '#f2efe9',
          fillOpacity: 1,
          opacity: 1
        }
      }).addTo(map);
      renderWells();
    });
};
document.head.appendChild(topoScript);

const markerCluster = L.markerClusterGroup({
  maxClusterRadius: 100,
  disableClusteringAtZoom: 6
});
map.addLayer(markerCluster);

// ==================== RENDER ====================
function renderWells(){
  markerCluster.clearLayers();
  let shown = 0;
  const counts = {};
  PHASE_META.forEach(p => counts[p.key] = 0);
  let total = WELLS_DATA.length;

  for(const w of WELLS_DATA){
    if(!activePhases.has(w.phase)) continue;

    const marker = L.circleMarker([w.lat, w.lon], {
      radius: 5,
      color: w.color,
      weight: 1,
      fillColor: w.color,
      fillOpacity: 0.75
    });
    marker.bindPopup(
      '<div class="popup-name">' + titleCase(w.name) + '</div>' +
      '<div class="popup-row">API: <span>' + w.api + '</span></div>' +
      '<div class="popup-row">Operator: <span>' + titleCase(w.operator) + '</span></div>' +
      '<div class="popup-row">Lease: <span>' + titleCase(w.lease) + '</span></div>' +
      '<div class="popup-row">Field: <span>' + titleCase(w.field) + '</span></div>' +
      '<div class="popup-row">Phase: <span style="color:' + w.color + ';font-weight:600">' + w.phase + '</span></div>' +
      '<div class="popup-row">Latitude: <span>' + w.lat.toFixed(5) + '</span></div>' +
      '<div class="popup-row">Longitude: <span>' + w.lon.toFixed(5) + '</span></div>',
      {maxWidth:230}
    );
    markerCluster.addLayer(marker);
    shown++;
    if(counts[w.phase] !== undefined) counts[w.phase]++;
  }

  document.getElementById('dot-count').textContent = shown.toLocaleString();

  let html = '<div class="stat-row"><span class="stat-label">Showing</span><span class="stat-val">' + shown.toLocaleString() + '</span></div>';
  html += '<hr class="stat-divider"/>';
  PHASE_META.forEach(p => {
    html += '<div class="stat-row"><span class="stat-label" style="color:' + p.color + ';font-weight:500">' + p.label + '</span><span class="stat-val">' + counts[p.key].toLocaleString() + '</span></div>';
  });
  html += '<hr class="stat-divider"/>';
  html += '<div class="stat-row"><span class="stat-label">Total in file</span><span class="stat-val">' + total.toLocaleString() + '</span></div>';
  document.getElementById('stats-body').innerHTML = html;
}

// ==================== FILTER BUTTONS ====================
function updateButtons(){
  document.querySelectorAll('.tech-btn').forEach(btn => {
    btn.classList.toggle('inactive', !activePhases.has(btn.dataset.phase));
  });
}

document.querySelectorAll('.tech-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.phase;
    if(activePhases.has(key)) activePhases.delete(key);
    else activePhases.add(key);
    updateButtons();
    renderWells();
  });
});

document.getElementById('btn-all').addEventListener('click', () => {
  activePhases = new Set(PHASE_META.map(p => p.key));
  updateButtons();
  renderWells();
});
document.getElementById('btn-none').addEventListener('click', () => {
  activePhases = new Set();
  updateButtons();
  renderWells();
});

updateButtons();

// ==================== EXPORT PDF ====================
document.getElementById('btn-export').addEventListener('click', async () => {
  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="white" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="0"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.8s" repeatCount="indefinite"/></circle></svg> Generating…';

  try {
    const mapEl = document.getElementById('map');
    const canvas = await html2canvas(mapEl, {
      useCORS: true,
      allowTaint: true,
      scale: 2,
      logging: false,
      backgroundColor: '#a8d4e8'
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width / 2, canvas.height / 2] });

    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width / 2, canvas.height / 2);

    const headerEl = document.getElementById('header');
    const headerCanvas = await html2canvas(headerEl, { scale: 2, backgroundColor: '#ffffff', logging: false });
    const headerImg = headerCanvas.toDataURL('image/jpeg', 0.95);
    const hRatio = headerCanvas.height / headerCanvas.width;
    const hW = canvas.width / 2;
    const hH = hW * hRatio;

    pdf.addPage([canvas.width / 2, hH + canvas.height / 2], 'landscape');
    pdf.addImage(headerImg, 'JPEG', 0, 0, hW, hH);
    pdf.addImage(imgData, 'JPEG', 0, hH, canvas.width / 2, canvas.height / 2);

    // Filename: All when every phase active, else dash-joined short keys (sanitized)
    const all = activePhases.size === PHASE_META.length;
    const slug = (s) => s.replace(/[^A-Za-z0-9]+/g, '');
    const filterPart = all ? 'All' : PHASE_META.filter(p => activePhases.has(p.key)).map(p => slug(p.short)).join('-');
    pdf.save('Orphan_Wells_California_' + filterPart + '_' + REPORT_DATE_ISO + '.pdf');
  } catch(e) {
    alert('Export failed: ' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PDF';
});
