<head>
<!-- Lantern protected-page auth guard -->
<script>document.documentElement.style.display = "none";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://wfllgewdehtbnhtxzgcw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_QYDr-CojuMsk2RkJEhZiNQ_muXKjaYD";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function protectPlatformPage() {
    try {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.replace("login.html");
        return;
      }

      const { data: access, error: accessError } = await supabaseClient
        .from("user_access")
        .select("has_access, plan_name")
        .eq("user_id", user.id)
        .single();

      if (accessError || !access || access.has_access !== true) {
        window.location.replace("lantern_pricing.html");
        return;
      }

      document.documentElement.style.display = "block";
    } catch (err) {
      window.location.replace("login.html");
    }
  }

  async function logoutUser() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  protectPlatformPage();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#a8d4e8;color:#2c2c2a;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{padding:10px 16px;background:#ffffff;border-bottom:1px solid #d6d2c8;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:500;position:relative}
#header h1{font-size:15px;font-weight:600;color:#2c2c2a;white-space:nowrap}
#header .subtitle{font-size:12px;color:#6b6b69}
#dropdowns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-group label{font-size:12px;color:#6b6b69;white-space:nowrap}
select{background:#ffffff;border:1px solid #c8c4bc;color:#2c2c2a;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
select:hover{background:#f5f3ef;border-color:#9a9690}
#filter-bar{padding:8px 16px;background:#faf8f5;border-bottom:1px solid #e8e4de;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:499;position:relative}
.filter-label{font-size:12px;color:#7a7570;font-weight:500;white-space:nowrap;margin-right:2px}
.tech-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1.5px solid transparent;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s;background:#fff;white-space:nowrap;user-select:none}
.tech-btn:active{transform:scale(0.97)}
.tech-btn .btn-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tech-btn.inactive{opacity:0.35;filter:grayscale(0.5)}
.filter-actions{display:flex;gap:6px}
.filter-actions button{background:#fff;border:1px solid #c8c4bc;color:#4a4a48;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.filter-actions button:hover{background:#f0ede8}
#map{flex:1}
#stats{position:absolute;bottom:28px;right:12px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid #d0ccc4;border-radius:8px;padding:10px 14px;min-width:200px;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
#stats h3{font-size:11px;font-weight:600;color:#7a7570;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;gap:16px}
.stat-label{color:#7a7570}
.stat-val{color:#2c2c2a;font-weight:500;text-align:right}
hr.stat-divider{border:none;border-top:1px solid #e8e4de;margin:6px 0}
.leaflet-popup-content-wrapper{background:#ffffff;border:1px solid #d0ccc4;border-radius:8px;color:#2c2c2a;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.leaflet-popup-tip{background:#ffffff}
.popup-name{font-weight:600;font-size:13px;margin-bottom:5px;color:#1a1a18}
.popup-row{font-size:12px;color:#7a7570;margin:2px 0}
.popup-row span{color:#2c2c2a}
.leaflet-control-zoom a{background:#ffffff;color:#2c2c2a;border-color:#c8c4bc}
.leaflet-control-zoom a:hover{background:#f5f3ef}
.leaflet-control-attribution{display:none!important}
#btn-export{display:flex;align-items:center;gap:6px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
#btn-export:hover{background:#254d7a}
#btn-export:disabled{background:#8a9bb0;cursor:wait}
#btn-export svg{flex-shrink:0}
</style>

    });
};
document.head.appendChild(topoScript);

let layerGroup = L.layerGroup().addTo(map);

function sizeFromMw(mw){
  if(mw<=1)    return 3;
  if(mw<=10)   return 4;
  if(mw<=50)   return 5;
  if(mw<=200)  return 6;
  if(mw<=500)  return 7.5;
  if(mw<=1000) return 9.5;
  return 12;
}

function renderDots(){
  layerGroup.clearLayers();
  const data = RAW[currentDs] || [];
  let shown = 0, totalMw = 0;
  const groupMw = {};
  GROUPS.forEach(g => groupMw[g] = 0);

  data.forEach(r => {
    if(!activeGroups.has(r.g)) return;
    if(currentState  && r.s   !== currentState)  return;
    if(currentSector && r.sec !== currentSector) return;
    if(r.mw < currentMinMw) return;

    const col = COLORS[r.g] || '#888';
    const mk = L.circleMarker([r.la, r.lo], {
      radius: sizeFromMw(r.mw),
      fillColor: col, color: '#fff', weight: 0.5, fillOpacity: 0.85
    });
    const dsLabel = {o:'Operating',p:'Planned',r:'Retired'}[currentDs];
    mk.bindPopup(`
        <div class="popup-name">${r.n}</div>
        <div class="popup-row">State: <span>${r.s}</span></div>
        <div class="popup-row">Status: <span>${dsLabel}</span></div>
        <div class="popup-row">Type: <span>${r.g}</span></div>
        <div class="popup-row">Technology: <span>${r.t}</span></div>
        ${r.y ? '<div class="popup-row">Year: <span>'+r.y+'</span></div>' : ''}
        <div class="popup-row">Capacity: <span>${r.mw.toLocaleString()} MW</span></div>
        <div class="popup-row">Sector: <span>${r.sec || '—'}</span></div>`,
        {maxWidth:230});
    mk.addTo(layerGroup);
    shown++;
    totalMw += r.mw;
    groupMw[r.g] += r.mw;
  });

  document.getElementById('dot-count').textContent = shown.toLocaleString();

  let statsHtml = `
    <div class="stat-row"><span class="stat-label">Generators</span><span class="stat-val">${shown.toLocaleString()}</span></div>
    <div class="stat-row"><span class="stat-label">Total capacity</span><span class="stat-val">${Math.round(totalMw).toLocaleString()} MW</span></div>
    <hr class="stat-divider"/>`;
  // Sort by MW descending
  const sortedGroups = GROUPS.filter(g => activeGroups.has(g) && groupMw[g] > 0)
    .sort((a, b) => groupMw[b] - groupMw[a]);
  const totalShownMw = sortedGroups.reduce((sum, g) => sum + groupMw[g], 0);
  sortedGroups.forEach(g => {
    const pct = totalShownMw > 0 ? (groupMw[g] / totalShownMw * 100).toFixed(1) : '0.0';
    statsHtml += `<div class="stat-row"><span class="stat-label" style="color:${COLORS[g]};font-weight:500">${g}</span><span class="stat-val">${Math.round(groupMw[g]).toLocaleString()} MW <span style="color:#9a9690;font-weight:400">(${pct}%)</span></span></div>`;
  });
  document.getElementById('stats-body').innerHTML = statsHtml;
}

function render(){
  if(typeof topojson !== 'undefined') renderDots();
}

function updateButtons(){
  document.querySelectorAll('.tech-btn').forEach(btn => {
    btn.classList.toggle('inactive', !activeGroups.has(btn.dataset.key));
  });
}

function buildTechButtons(){
  const container = document.getElementById('tech-buttons');
  TECH_META.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tech-btn';
    btn.dataset.key = t.key;
    btn.style.borderColor = t.color;
    btn.innerHTML = `<span class="btn-dot" style="background:${t.color}"></span>${t.key}`;
    btn.addEventListener('click', () => {
      if(activeGroups.has(t.key)) activeGroups.delete(t.key);
      else activeGroups.add(t.key);
      updateButtons();
      render();
    });
    container.appendChild(btn);
  });
}

function buildStateSelect(){
  const sel = document.getElementById('state-select');
  const states = [...new Set(RAW.r.map(r=>r.s))].sort();
  states.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s; sel.appendChild(o);
  });
}

function buildSectorSelect(){
  const sel = document.getElementById('sector-select');
  const sectors = [...new Set(RAW.r.map(r=>r.sec).filter(Boolean))].sort();
  sectors.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s; sel.appendChild(o);
  });
}

document.getElementById('state-select').addEventListener('change',  e => { currentState  = e.target.value; render(); });
document.getElementById('mw-select').addEventListener('change',     e => { currentMinMw  = +e.target.value; render(); });
document.getElementById('sector-select').addEventListener('change', e => { currentSector = e.target.value; render(); });
document.getElementById('btn-all').addEventListener('click',  () => { activeGroups = new Set(GROUPS); updateButtons(); render(); });
document.getElementById('btn-none').addEventListener('click', () => { activeGroups = new Set();        updateButtons(); render(); });

buildTechButtons();
buildStateSelect();
buildSectorSelect();



document.getElementById('btn-export').addEventListener('click', async () => {
  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="white" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="0"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.8s" repeatCount="indefinite"/></circle></svg> Generating…';

  try {
    const mapEl = document.getElementById('map');
    const canvas = await html2canvas(mapEl, {
      useCORS: true,
      allowTaint: true,
      scale: 2,
      logging: false,
      backgroundColor: '#a8d4e8'
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width / 2, canvas.height / 2] });

    // Add map image
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width / 2, canvas.height / 2);

    // Header bar snapshot
    const headerEl = document.getElementById('header');
    const headerCanvas = await html2canvas(headerEl, { scale: 2, backgroundColor: '#ffffff', logging: false });
    const headerImg = headerCanvas.toDataURL('image/jpeg', 0.95);
    const hRatio = headerCanvas.height / headerCanvas.width;
    const hW = canvas.width / 2;
    const hH = hW * hRatio;

    // New page with header + map stacked
    pdf.addPage([canvas.width / 2, hH + canvas.height / 2], 'landscape');
    pdf.addImage(headerImg, 'JPEG', 0, 0, hW, hH);
    pdf.addImage(imgData, 'JPEG', 0, hH, canvas.width / 2, canvas.height / 2);

    // Build filename with active filters
    const dsLabel = 'Retired';
    const state = document.getElementById('state-select').value || 'All States';
    const sector = document.getElementById('sector-select').value || 'All Sectors';
    const date = new Date().toISOString().slice(0,10);
    pdf.save(`US_Generation_${dsLabel}_${state}_${date}.pdf`);
  } catch(e) {
    alert('Export failed: ' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 1v7m0 0L4.5 5.5M7 8l2.5-2.5M2 10.5v1A1.5 1.5 0 003.5 13h7A1.5 1.5 0 0012 11.5v-1" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Export PDF';
});
</script>
